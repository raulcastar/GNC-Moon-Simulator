lc_component_imu:
  ros__parameters:
    # Run on the simulation clock (/clock from component_sim_clock): stamps
    # and timers follow Unreal's time, and pause when Play is not running.
    use_sim_time: true

    # ── Simulated IMU derived from /odom (Unreal pose telemetry) ──────────────
    # The rover node publishes Unreal's pose as nav_msgs/Odometry; this node
    # differentiates it into a sensor_msgs/Imu. Orientation passes straight
    # through from odom, so when the rover starts publishing real roll/pitch this
    # IMU reports them automatically.

    # Surface gravity. Moon = 1.62 m/s^2; use 9.81 to emulate an Earth test rig.
    # A level, stationary accelerometer reads (0, 0, +gravity).
    gravity:            1.62

    # Frame the IMU is reported in (the rover base; add an imu_link + TF if you
    # mount it elsewhere).
    imu_frame_id:       base_link

    odom_topic:         odom
    imu_topic:          imu/data

    # EMA smoothing for the differentiated gyro/accelerometer, 0..1. Position is
    # double-differentiated for acceleration, which is noisy at the odom rate, so
    # some smoothing is sensible. 0 = raw (jittery), higher = smoother but lagged.
    smoothing:          0.3

    # Optional sensor noise to make the sim behave like real hardware. 0 = ideal.
    accel_noise_std:    0.0     # m/s^2
    gyro_noise_std:     0.0     # rad/s

    # A pose gap larger than this (seconds) resets the differentiator instead of
    # emitting a huge spike — covers Unreal Play/Stop teleports and dropouts.
    max_dt:             0.5
