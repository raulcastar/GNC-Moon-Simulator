lc_component_path_planner:
  ros__parameters:
    # ---------------------------------------------------------
    # Map & Environment Configuration
    # ---------------------------------------------------------
    elevation_map_path: "maps/procedural_lunar_terrain_1_elevationMap.csv"
    soil_map_path: "maps/procedural_lunar_terrain_1_soilMap_edges_0.csv"
    global_res: 1.0
    slope_threshold: 30.0

    # ---------------------------------------------------------
    # Planning & Control Tuning
    # ---------------------------------------------------------
    control_rate_hz: 10.0          # The frequency of the DWA control loop
    lookahead_dist: 2.5            # Distance to look ahead on the global path

    # ---------------------------------------------------------
    # Mission Waypoints (X, Y)
    # ---------------------------------------------------------
    start_pos: [5, 5]
    goal_pos: [200, 200]

    # ---------------------------------------------------------
    # Debug & Visualization
    # ---------------------------------------------------------
    debug_mode: true
    enable_path_visualization: true

    # ---------------------------------------------------------
    # Goal Reached rolerances
    # ---------------------------------------------------------
    braking_distance: 4.5    # Start slowing down
    stop_tolerance: 0.7      # Parking zone radius