lc_component_path_planner:
  ros__parameters:
    # Run on the simulation clock (/clock from component_sim_clock): stamps
    # and timers follow Unreal's time, and pause when Play is not running.
    use_sim_time: true

    # ---------------------------------------------------------
    # Map & Environment Configuration
    # ---------------------------------------------------------
    elevation_map_path: "maps/procedural_lunar_terrain_1_elevationMap_2.csv"
    soil_map_path: "maps/procedural_lunar_terrain_1_soilMap_edges_0_2.csv"
    global_res: 1.0
    slope_threshold: 15.0         # [deg] steeper cells are impassable
    max_tilt_deg: 25.0            # [deg] abort the goal above this body tilt (static tip-over: ~58 deg)

    # ---------------------------------------------------------
    # Planning & Control Tuning
    # ---------------------------------------------------------
    control_rate_hz: 10.0         # The frequency of the DWA control loop
    lookahead_dist: 4.0           # Distance to look ahead on the global path
    max_speed: 0.5                # [m/s] below the rover's ~0.6 m/s traction limit
    min_speed: 0.0                # [m/s]
    max_accel: 0.1                # [m/s^2] matches the rover node's accel limit (Moon gravity)
    max_yaw_rate_deg: 8.0         # Degrees per second (0.14 rad/s: faster spot turns make the rover hop under Moon gravity)
    max_delta_yaw_rate_deg: 17.0  # Degrees per second squared (0.3 rad/s^2, the rover node's limit)
    v_resolution: 0.005           # < max_accel * dt (0.01), or only v = 0 is sampled; 4 samples, a DWA cycle ~10 ms
    yaw_rate_resolution_deg: 0.5

    # DWA Prediction & Costs
    dt: 0.1                       # [s]
    predict_time: 1.5             # [s]
    to_goal_cost_gain: 1.0
    speed_cost_gain: 1.0
    obstacle_cost_gain: 1.0
    robot_stuck_flag_cons: 0.001
    
    # Robot Geometry
    robot_width: 0.35             # [m]
    robot_length: 0.35            # [m]
    robot_radius: 0.35            # [m]

    # ---------------------------------------------------------
    # Lidar obstacle avoidance
    # ---------------------------------------------------------
    # On: every lidar scan is levelled, the local ground plane fitted, and the
    # points higher than obstacle_min_height_m above it become obstacles. The
    # DWA steers around them (remembered for obstacle_memory_s, so a rock that
    # leaves the lidar's view while turning is not forgotten), and their 1 m
    # map cells are marked impassable: when the route within
    # obstacle_replan_lookahead_m crosses one, it is planned again around it.
    # They are published on planner/obstacles (odom frame).
    # Off: the rover follows the route without looking (the maps' slopes and
    # soil only). Read every cycle, so it can be switched while driving:
    #   ros2 param set /lc_component_path_planner lidar_obstacle_avoidance false
    lidar_obstacle_avoidance: true
    lidar_topic: "lidar/points"
    lidar_pitch_deg: -20.0          # [deg] the lidar's mounting pitch (negative = down)
    lidar_x_offset_m: 0.0           # [m] lidar ahead of the rover's odometry point
    obstacle_min_height_m: 0.15     # [m] above the local ground: the rover's body clears less
    obstacle_max_range_m: 6.0       # [m] ahead; farther returns are ignored
    obstacle_memory_s: 20.0         # [s] an obstacle not seen again is forgotten after this
    obstacle_replan_lookahead_m: 5.0  # [m] of route checked for newly blocked cells

    # ---------------------------------------------------------
    # Debug & Visualization
    # ---------------------------------------------------------
    debug_mode: true
    enable_path_visualization: false

    # ---------------------------------------------------------
    # Goal Reached rolerances
    # ---------------------------------------------------------
    braking_distance: 4.5    # Start slowing down
    stop_tolerance: 0.7      # Parking zone radius