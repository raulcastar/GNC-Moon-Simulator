<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNC MOON SIM — Cameras</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script src="/feed_legends.js"></script>
<script src="/nav_overlay.js"></script>
<style>
  :root {
    --bg:      #10151c;
    --panel:   #18212e;
    --panel2:  #202b3a;
    --line:    #2c3a4e;
    --text:    #e6edf5;
    --dim:     #8aa0b8;
    --accent:  #33d6a6;
    --cyan:    #59b0ff;
    --amber:   #ffbe5c;
    --mono:    'Consolas','Menlo','DejaVu Sans Mono',monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--mono);
    font-size: 13px; overflow: hidden;
    display: grid; grid-template-rows: 46px 1fr; gap: 6px; padding: 6px;
  }

  /* ============ HEADER ============ */
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 4px; flex-wrap: nowrap;
    overflow-x: auto;
  }
  a.back {
    color: var(--dim); text-decoration: none; font-size: 11px; letter-spacing: 1px;
    border: 1px solid var(--line); padding: 6px 11px; border-radius: 4px; white-space: nowrap;
  }
  a.back:hover { color: var(--cyan); border-color: var(--cyan); }
  .brand { color: var(--accent); font-weight: bold; letter-spacing: 3px; font-size: 15px;
           text-shadow: 0 0 12px rgba(51,214,166,.3); white-space: nowrap; }
  .brand small { color: var(--dim); letter-spacing: 1px; font-size: 10px; display: block; }
  .spacer { flex: 1; }

  .chips { display: flex; gap: 6px; }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px; cursor: pointer;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 10px; white-space: nowrap; user-select: none;
  }
  .chip:hover { border-color: var(--cyan); }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent);
             font-weight: bold; }

  .conn { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: 1px;
          color: var(--dim); white-space: nowrap; }
  .conn .dot { width: 10px; height: 10px; border-radius: 50%; background: #402028; }
  .conn .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ============ WALL ============ */
  /* Column count and tile width are set by layout() to fill the screen. */
  #wall {
    min-height: 0; overflow: hidden; padding: 2px;
    display: grid; gap: 6px; align-content: center; justify-content: center;
  }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .tile.hidden { display: none; }
  .tile .title {
    padding: 4px 10px; font-size: 10px; letter-spacing: 2px; color: var(--dim);
    border-bottom: 1px solid var(--line); background: var(--panel2);
    display: flex; align-items: center; gap: 8px;
  }
  .tile .title .tag { color: var(--accent); }
  .tile .title .stat { margin-left: auto; letter-spacing: 1px; }
  .tile .title .stat.stale { color: var(--amber); }
  .tile .title .stat.dead { color: #ff6b7d; }
  .tile .feed { position: relative; background: #000; aspect-ratio: 4 / 3; overflow: hidden; cursor: zoom-in; }
  .tile.focus .feed { cursor: zoom-out; }
  .tile .feed img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .nosig {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #24344a; font-size: 12px; letter-spacing: 4px;
    background: repeating-linear-gradient(0deg, #10151c 0 2px, #161d28 2px 4px);
  }
  #empty {
    grid-column: 1 / -1; text-align: center; color: var(--dim);
    padding: 60px 20px; letter-spacing: 2px; font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="#" id="hublink">◀ MENU</a>
    <div class="brand">CAMERAS<small>SELECT FEEDS</small></div>
    <div class="spacer"></div>
    <div class="chips" id="chips"></div>
    <div class="conn"><span class="dot" id="cdot"></span><span id="cstate">OFFLINE</span></div>
  </header>

  <div id="wall"></div>

<script>
  const host = window.location.hostname || 'localhost';
  document.getElementById('hublink').href = `http://${host}:5000/`;

  const $ = id => document.getElementById(id);
  const socket = io();

  // The selectable feeds (feed id -> label). Ids match what the ROS node emits.
  const FEEDS = [
    ['cam_central', 'CENTRAL'],
    ['cam_left',    'LEFT'],
    ['cam_right',   'RIGHT'],
    ['cam_rear',    'REAR'],
    ['depth',       'STEREO DEPTH'],
    ['depth_gt',    'GROUND TRUTH DEPTH'],
    ['mask',        'SEGMENTATION'],
    ['shadow',      'SHADOW MASK'],
    ['events',      'EVENT CAM'],
    ['spad',        'SPAD CAM'],
  ];

  // Persisted show/hide state. Default: everything visible.
  let sel = {};
  try { sel = JSON.parse(localStorage.getItem('cam_sel') || '{}'); } catch (e) { sel = {}; }
  FEEDS.forEach(([id]) => { if (!(id in sel)) sel[id] = true; });
  const save = () => localStorage.setItem('cam_sel', JSON.stringify(sel));

  // Build chips + tiles.
  const chips = $('chips'), wall = $('wall');
  const empty = document.createElement('div');
  empty.id = 'empty';
  empty.textContent = 'NO FEEDS SELECTED — pick one above';

  FEEDS.forEach(([id, label]) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (sel[id] ? ' on' : '');
    chip.textContent = label;
    chip.onclick = () => { sel[id] = !sel[id]; chip.classList.toggle('on', sel[id]);
                           save(); applyVisibility(); };
    chips.appendChild(chip);

    const tile = document.createElement('div');
    tile.className = 'tile' + (sel[id] ? '' : ' hidden');
    tile.id = 't-' + id;
    tile.innerHTML =
      `<div class="title"><span class="tag">◈</span>${label}<span class="stat" id="s-${id}">—</span></div>` +
      `<div class="feed"><div class="nosig">NO SIGNAL</div><img style="display:none"></div>`;
    wall.appendChild(tile);
    tile.querySelector('.feed').onclick = () => { focusId = focusId === id ? null : id; applyVisibility(); };
  });

  // Click a feed to enlarge it; click again or press Esc to return to the wall.
  let focusId = null;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && focusId) { focusId = null; applyVisibility(); }
  });

  function applyVisibility() {
    if (focusId && !sel[focusId]) focusId = null;
    let shown = 0;
    FEEDS.forEach(([id]) => {
      const on = focusId ? id === focusId : !!sel[id];
      $('t-' + id).classList.toggle('hidden', !on);
      $('t-' + id).classList.toggle('focus', id === focusId);
      shown += on ? 1 : 0;
    });
    if (shown) { if (empty.parentNode) empty.remove(); }
    else if (!empty.parentNode) { wall.appendChild(empty); }
    layout(shown);
  }

  // Pick the column count that gives the largest 4:3 tiles that fit the screen.
  const TITLE_H = 23, GAP = 6;
  function layout(n) {
    n = n || FEEDS.filter(([id]) => focusId ? id === focusId : sel[id]).length;
    if (!n) return;
    const W = wall.clientWidth - 4, H = wall.clientHeight - 4;
    let best = { w: 0, cols: 1 };
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const wByWidth = (W - GAP * (cols - 1)) / cols;
      const wByHeight = ((H - GAP * (rows - 1)) / rows - TITLE_H) * 4 / 3;
      const w = Math.floor(Math.min(wByWidth, wByHeight));
      if (w > best.w) best = { w, cols };
    }
    wall.style.gridTemplateColumns = `repeat(${best.cols}, ${best.w}px)`;
  }
  window.addEventListener('resize', () => layout());
  applyVisibility();

  // Connection status.
  socket.on('connect',    () => { $('cdot').classList.add('ok'); $('cstate').textContent = 'ONLINE'; });
  socket.on('disconnect', () => { $('cdot').classList.remove('ok'); $('cstate').textContent = 'OFFLINE'; });

  // Depth / segmentation legends, and per-feed rate and age.
  FeedLegends.attach(socket, {
    depth: [$('t-depth').querySelector('.feed'), $('t-depth_gt').querySelector('.feed')],
    mask: [$('t-mask').querySelector('.feed')],
    shadow: [$('t-shadow').querySelector('.feed')],
  });
  NavOverlay.attach(socket, [$('t-cam_central').querySelector('.feed')]);
  socket.on('health', h => {
    const f = h.feeds || {};
    FEEDS.forEach(([id]) => {
      const el = $('s-' + id), d = f[id];
      if (!d) { el.textContent = 'no data'; el.className = 'stat dead'; return; }
      el.textContent = `${d.hz.toFixed(1)} Hz · ${d.age.toFixed(1)} s`;
      el.className = 'stat' + (d.age < 3 ? '' : d.age < 10 ? ' stale' : ' dead');
    });
  });

  // Feeds. Render into the tile regardless of visibility (cheap); CSS hides it.
  socket.on('feed', m => {
    const tile = $('t-' + m.id);
    if (!tile) return;
    const img = tile.querySelector('img');
    img.src = 'data:image/jpeg;base64,' + m.image;
    if (img.style.display === 'none') {
      img.style.display = 'block';
      tile.querySelector('.nosig').style.display = 'none';
    }
  });
</script>
</body>
</html>
