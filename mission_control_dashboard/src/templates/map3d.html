<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNC MOON SIM — 3D Map (LiDAR + DEM)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/local_dem.js"></script>
<script src="/lidar_view.js"></script>
<style>
  :root {
    --bg:      #10151c;
    --panel:   #18212e;
    --panel2:  #202b3a;
    --line:    #2c3a4e;
    --text:    #e6edf5;
    --dim:     #8aa0b8;
    --accent:  #33d6a6;   /* X axis */
    --cyan:    #59b0ff;   /* Y axis */
    --amber:   #ffbe5c;   /* Z axis */
    --red:     #ff6b7d;
    --mono:    'Consolas','Menlo','DejaVu Sans Mono',monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono);
         display: flex; flex-direction: column; height: 100%; overflow: hidden; }

  header { display: flex; align-items: center; gap: 18px; padding: 10px 16px;
           background: linear-gradient(180deg, var(--panel2), var(--panel));
           border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .brand { color: var(--accent); font-weight: bold; letter-spacing: 3px; font-size: 15px; }
  .brand small { color: var(--dim); letter-spacing: 2px; font-size: 10px; font-weight: normal; }
  a.hub { text-decoration: none; color: var(--text); border: 1px solid var(--line);
          background: var(--panel2); border-radius: 6px; padding: 7px 12px; font-size: 12px;
          letter-spacing: 2px; transition: border-color .12s, color .12s; }
  a.hub:hover { border-color: var(--accent); color: var(--accent); }
  .status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red);
         box-shadow: 0 0 8px var(--red); }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .tele { margin-left: auto; display: flex; gap: 16px; font-size: 12px; }
  .tele .k { color: var(--dim); letter-spacing: 1px; }
  .tele .v { color: var(--cyan); }

  main { flex: 1 1 auto; display: flex; min-height: 0; gap: 8px; padding: 8px; }
  .panel { flex: 1 1 0; min-width: 320px; display: flex; flex-direction: column;
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           overflow: hidden; position: relative; }
  .panel-title { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
                 border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 2px;
                 color: var(--dim); flex: 0 0 auto; }
  .panel-title .tag { color: var(--accent); }
  .panel-title .age { margin-left: auto; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .view { flex: 1 1 auto; position: relative; min-height: 0; }
  .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .nosig { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           color: var(--dim); font-size: 13px; letter-spacing: 2px; z-index: 4; }

  @media (max-width: 900px) { main { flex-direction: column; } .panel { min-width: 0; } }
</style>
</head>
<body>
  <header>
    <a class="hub" id="hub-link">◀ HUB</a>
    <div class="brand">GNC&nbsp;MOON&nbsp;·&nbsp;3D&nbsp;MAP<br><small>LIDAR + LOCAL DEM</small></div>
    <div class="status"><span class="dot" id="cdot"></span><span id="cstate">OFFLINE</span></div>
    <div class="tele">
      <div><span class="k">POS</span> <span class="v" id="t-pos">—</span> m</div>
      <div><span class="k">HDG</span> <span class="v" id="t-yaw">—</span>°</div>
      <div><span class="k">SPD</span> <span class="v" id="t-spd">—</span> m/s</div>
    </div>
  </header>

  <main>
    <!-- ============ LIDAR 3D ============ -->
    <div class="panel">
      <div class="panel-title"><span class="tag">◎</span>LIDAR — 3D · ROVER FRAME
        <span class="age" id="lidar-info">no signal</span></div>
      <div class="view" id="lidarView">
        <div class="nosig" id="lidar-nosig">waiting for /lidar/points…</div>
      </div>
    </div>

    <!-- ============ LOCAL DEM ============ -->
    <div class="panel">
      <div class="panel-title"><span class="tag">▦</span>LOCAL DEM — TERRAIN RELIEF · DRAG · WHEEL
        <span class="age" id="dem-info">no signal</span></div>
      <div class="view" id="demView">
        <div class="nosig" id="dem-nosig">waiting for /local_mapping/elevation_grid…</div>
      </div>
    </div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const host = window.location.hostname || 'localhost';
  $('hub-link').href = `http://${host}:5000/`;

  const socket = io();
  socket.on('connect',    () => { $('cdot').classList.add('ok'); $('cstate').textContent = 'ONLINE'; });
  socket.on('disconnect', () => { $('cdot').classList.remove('ok'); $('cstate').textContent = 'OFFLINE'; });

  let currentPose = null;
  socket.on('odom_update', m => {
    currentPose = m;
    $('t-pos').textContent = `${m.x.toFixed(1)}, ${m.y.toFixed(1)}`;
    $('t-yaw').textContent = m.yaw.toFixed(0);
    $('t-spd').textContent = m.speed.toFixed(2);
  });

  /* ---- lidar (shared view, lidar_view.js) ---- */
  const lidarView = LidarView($('lidarView'), { info: $('lidar-info') });
  socket.on('lidar', m => {
    $('lidar-nosig').style.display = 'none';
    lidarView.update(m);
  });

  /* ---- local DEM (shared view, local_dem.js) ---- */
  const demView = LocalDemView($('demView'), { info: $('dem-info'), nosig: $('dem-nosig') });
  socket.on('local_dem', m => demView.update(m));
  socket.on('local_dem_lidar', m => demView.updateLidar(m));

  /* keep both views sized to the window */
  window.addEventListener('resize', () => { lidarView.redraw(); demView.redraw(); });
</script>
</body>
</html>
