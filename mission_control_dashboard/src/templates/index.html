<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lunar Rover Mission Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }
        
        .header { text-align: center; flex: 0 0 auto; padding: 10px; }
        h2, p { margin: 0; padding: 2px; }

        .main-layout { display: flex; flex: 1; min-height: 0; padding: 10px; gap: 20px; }

        .map-section { display: flex; flex: 2; justify-content: center; align-items: stretch; gap: 10px; }

        .map-wrapper { position: relative; aspect-ratio: 1 / 1; height: 100%; max-width: 100%; }

        #canvas-container { position: relative; width: 100%; height: 100%; border: 2px solid #555; background-color: black; }
        canvas.layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
        #mapCanvas { z-index: 1; }
        #odomCanvas { z-index: 2; }
        
        /* --- NEW: The Loading Overlay Styling --- */
        #loading-overlay {
            display: none;
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00ffff;
            padding: 15px 30px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            z-index: 10;
            font-family: monospace; font-size: 18px; font-weight: bold;
            pointer-events: none; /* Prevents the overlay from blocking mouse clicks */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        #colorbar-container { width: 70px; height: 100%; display: none; flex-direction: column; text-align: left; }
        #colorbarCanvas { width: 100%; flex: 1; min-height: 0; border: 1px solid #555;}

        .camera-section { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 300px; }
        .feed-box { flex: 1; display: flex; flex-direction: column; border: 2px solid #555; background: #000; min-height: 0; }
        .feed-title { text-align: center; font-size: 14px; background: #333; padding: 5px; margin: 0; font-weight: bold; }
        .feed-box img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Mission Control Dashboard</h2>
        <p>Click anywhere on the topographical map to dispatch the rover.</p>
    </div>

    <div class="main-layout">
        <div class="map-section">
            <div class="map-wrapper">
                <div id="canvas-container">
                    <canvas id="mapCanvas" class="layer"></canvas>
                    <canvas id="odomCanvas" class="layer"></canvas>
                </div>
                <div id="loading-overlay">Calculating Optimal Path...</div>
            </div>
            
            <div id="colorbar-container">
                <div style="font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 4px; color: white;">Elev.</div>
                <canvas id="colorbarCanvas"></canvas>
            </div>
        </div>

        <div class="camera-section">
            <div class="feed-box">
                <div class="feed-title">Color Camera (RGB)</div>
                <img id="colorStream" src="" alt="Waiting for Video Stream..." />
            </div>
            <div class="feed-box">
                <div class="feed-title">Depth Camera (Normalized)</div>
                <img id="depthStream" src="" alt="Waiting for Depth Stream..." />
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        
        const mapCanvas = document.getElementById('mapCanvas');
        const mapCtx = mapCanvas.getContext('2d');
        const odomCanvas = document.getElementById('odomCanvas');
        const odomCtx = odomCanvas.getContext('2d');
        const cbCanvas = document.getElementById('colorbarCanvas');
        const cbCtx = cbCanvas.getContext('2d');

        let mapRes = 1.0; let mapWidth = 0; let mapHeight = 0;
        let currentPose = null; let globalPath = []; let actualTrajectory = [];
        let minHeightLabel = "0.0m"; let maxHeightLabel = "0.0m";

        function getViridisColor(t) {
            t = Math.max(0.0, Math.min(1.0, t));
            const stops = [
                { t: 0.00, r: 68,  g: 1,   b: 84  },  
                { t: 0.25, r: 59,  g: 82,  b: 139 },  
                { t: 0.50, r: 33,  g: 145, b: 140 },  
                { t: 0.75, r: 94,  g: 201, b: 98  },  
                { t: 1.00, r: 253, g: 231, b: 37  }   
            ];
            for (let i = 0; i < stops.length - 1; i++) {
                if (t >= stops[i].t && t <= stops[i+1].t) {
                    const range = stops[i+1].t - stops[i].t;
                    const local_t = (t - stops[i].t) / range;
                    const r = Math.round(stops[i].r + local_t * (stops[i+1].r - stops[i].r));
                    const g = Math.round(stops[i].g + local_t * (stops[i+1].g - stops[i].g));
                    const b = Math.round(stops[i].b + local_t * (stops[i+1].b - stops[i].b));
                    return [r, g, b];
                }
            }
            return [253, 231, 37]; 
        }

        function drawOverlay() {
            if (mapWidth === 0 || mapHeight === 0) return;
            odomCtx.clearRect(0, 0, odomCanvas.width, odomCanvas.height);

            odomCtx.save();
            odomCtx.lineWidth = 1;
            odomCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            odomCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            odomCtx.font = '14px Arial';
            odomCtx.setLineDash([5, 5]);
            
            const gridStepPixels = 200 / mapRes;

            for (let i = 0; i <= mapWidth; i += gridStepPixels) {
                odomCtx.beginPath();
                odomCtx.moveTo(i, 0);
                odomCtx.lineTo(i, mapHeight);
                odomCtx.stroke();
                odomCtx.fillText(Math.round(i * mapRes), i + 5, mapHeight - 5);
            }

            for (let j = 0; j <= mapHeight; j += gridStepPixels) {
                odomCtx.beginPath();
                odomCtx.moveTo(0, j);
                odomCtx.lineTo(mapWidth, j);
                odomCtx.stroke();
                let labelY = Math.round((mapHeight - j) * mapRes);
                if (labelY !== 0) odomCtx.fillText(labelY, 5, j - 5);
            }
            odomCtx.restore();

            if (globalPath.length > 0) {
                odomCtx.beginPath(); odomCtx.strokeStyle = 'red'; odomCtx.lineWidth = 3;
                for (let i = 0; i < globalPath.length; i++) {
                    let pxX = globalPath[i].x / mapRes; let pxY = mapHeight - (globalPath[i].y / mapRes);
                    if (i === 0) odomCtx.moveTo(pxX, pxY); else odomCtx.lineTo(pxX, pxY);
                }
                odomCtx.stroke();
            }

            if (actualTrajectory.length > 0) {
                odomCtx.beginPath(); odomCtx.strokeStyle = 'blue'; odomCtx.lineWidth = 3;
                for (let i = 0; i < actualTrajectory.length; i++) {
                    let pxX = actualTrajectory[i].x / mapRes; let pxY = mapHeight - (actualTrajectory[i].y / mapRes);
                    if (i === 0) odomCtx.moveTo(pxX, pxY); else odomCtx.lineTo(pxX, pxY);
                }
                odomCtx.stroke();
            }

            if (currentPose) {
                let pxX = currentPose.x / mapRes; let pxY = mapHeight - (currentPose.y / mapRes);
                odomCtx.beginPath(); odomCtx.arc(pxX, pxY, 7, 0, 2 * Math.PI, false);
                odomCtx.fillStyle = 'cyan'; odomCtx.fill(); odomCtx.strokeStyle = 'white'; odomCtx.stroke();
            }
        }

        function drawColorbar(rangeExists) {
            if (!rangeExists) return;
            document.getElementById('colorbar-container').style.display = 'flex';
            
            cbCanvas.width = cbCanvas.clientWidth;
            cbCanvas.height = cbCanvas.clientHeight;
            
            cbCtx.clearRect(0, 0, cbCanvas.width, cbCanvas.height);
            const levels = 20;
            const bH = cbCanvas.height / levels;
            for(let i = 0; i < levels; i++) {
                let c_t = Math.floor(((levels - 1 - i) / (levels - 1)) * levels) / levels;
                let color = getViridisColor(c_t);
                cbCtx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                cbCtx.fillRect(0, i * bH, cbCanvas.width, Math.ceil(bH));
            }
            cbCtx.fillStyle = 'white'; cbCtx.font = '12px Courier New'; cbCtx.textAlign = 'left'; cbCtx.textBaseline = 'middle';
            cbCtx.fillText(maxHeightLabel + "m", 5, 12);
            cbCtx.fillText(minHeightLabel + "m", 5, cbCanvas.height - 12);
        }

        // --- WebSocket Listeners ---
        socket.on('color_frame', msg => { document.getElementById('colorStream').src = "data:image/jpeg;base64," + msg.image; });
        socket.on('depth_frame', msg => { document.getElementById('depthStream').src = "data:image/jpeg;base64," + msg.image; });
        
        socket.on('global_path_update', msg => { 
            // --- NEW: Hide the loading prompt when the path arrives ---
            document.getElementById('loading-overlay').style.display = 'none';
            globalPath = msg.path; 
            drawOverlay(); 
        });

        socket.on('trajectory_update', msg => { actualTrajectory = msg.path; drawOverlay(); });
        socket.on('odom_update', msg => { currentPose = msg; drawOverlay(); });

        socket.on('map_update', function(msg) {
            mapWidth = msg.width; mapHeight = msg.height; mapRes = msg.resolution;
            
            mapCanvas.width = mapWidth; mapCanvas.height = mapHeight;
            odomCanvas.width = mapWidth; odomCanvas.height = mapHeight;

            const imgData = mapCtx.createImageData(mapWidth, mapHeight);
            let cMin = Infinity; let cMax = -Infinity;
            for (let i = 0; i < msg.data.length; i++) {
                if (msg.data[i] < 9999.0) {
                    if (msg.data[i] < cMin) cMin = msg.data[i];
                    if (msg.data[i] > cMax) cMax = msg.data[i];
                }
            }
            let hR = cMax - cMin; let valid = (cMax !== -Infinity && cMin !== Infinity);
            if (valid) {
                if (hR === 0) hR = 1.0;
                minHeightLabel = cMin.toFixed(1); maxHeightLabel = cMax.toFixed(1);
            }

            for (let i = 0; i < msg.data.length; i++) {
                let x = i % mapWidth; let y = Math.floor(i / mapWidth);
                let pI = (((mapHeight - 1) - y) * mapWidth + x) * 4;
                if (msg.data[i] >= 9999.0) {
                    imgData.data[pI] = 0; imgData.data[pI+1] = 0; imgData.data[pI+2] = 0; imgData.data[pI+3] = 255; 
                } else if (valid) {
                    let vC = getViridisColor(Math.floor(((msg.data[i] - cMin) / hR) * 20.0) / 20.0);
                    imgData.data[pI] = vC[0]; imgData.data[pI+1] = vC[1]; imgData.data[pI+2] = vC[2]; imgData.data[pI+3] = 255;
                }
            }
            mapCtx.putImageData(imgData, 0, 0);
            drawColorbar(valid); drawOverlay();
        });

        odomCanvas.addEventListener('mousedown', function(e) {
            const rect = odomCanvas.getBoundingClientRect();
            
            const scaleX = odomCanvas.width / rect.width;
            const scaleY = odomCanvas.height / rect.height;

            let pixelX = (e.clientX - rect.left) * scaleX;
            let pixelY = (e.clientY - rect.top) * scaleY;

            let targetX = pixelX * mapRes;
            let targetY = (mapHeight - pixelY) * mapRes;

            // --- NEW: Show the loading prompt while we wait for the planner ---
            document.getElementById('loading-overlay').style.display = 'block';

            socket.emit('send_goal', { x: targetX, y: targetY });
        });
        
        window.addEventListener('resize', () => { if(mapWidth > 0) drawColorbar(true); });
    </script>
</body>
</html>
