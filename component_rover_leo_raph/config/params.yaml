lc_component_rover_leo_raph:
  ros__parameters:
    # Run on the simulation clock (/clock from component_sim_clock): stamps
    # and timers follow Unreal's time, and pause when Play is not running.
    use_sim_time: true

    # udp | tcp
    #
    # tcp carries commands and telemetry on one bidirectional connection, so
    # neither side needs the other's address (the UDP path's weak point under
    # WSL2 mirrored networking). Messages are JSON objects.
    #
    # udp is the legacy two-socket scheme (sending_port out, listen_port in).
    transport:                           tcp

    # Who dials. Unreal's TCP component connects out, so this side listens.
    #   server  we listen on tcp_port; Unreal connects to us
    #   client  we connect to a listening Unreal at sending_ip:tcp_port
    tcp_role:                         server
    tcp_port:                            3003

    # Where Unreal's UDP plugin listens for drive commands.
    #
    # 127.0.0.1 is correct under WSL2 mirrored networking: datagrams sent there
    # from the container reach Unreal on the Windows host. The host's LAN
    # address is ambiguous between Windows and WSL, and loses packets.
    #
    # 0.0.0.0 means autodetect (take Unreal's address from the source of its
    # telemetry). It only works once Unreal actually sends telemetry, so it is
    # not the default.
    sending_ip:                    127.0.0.1
    sending_port:                       3002

    # Wildcard here is correct: accept telemetry on every interface.
    listen_ip:                       0.0.0.0
    listen_port:                        3001
    # m/s -> Unreal wheel input units. Measured with physics substepping and low
    # body damping: 0.2 m/s commanded -> 0.196 m/s (Moon) / 0.201 m/s (Earth)
    # driven, so gravity barely changes it (the damping did).
    wheel_speed_scale:                  1.82
    # Centimeters, effective skid-steer track (physical: 38; skid-steer slip makes
    # the effective one wider). Calibrated on level ground under Earth gravity:
    # with 96, 0.3 rad/s commanded -> 0.31-0.34 rad/s turned, so 96 * 0.3 / 0.3235.
    # (Moon gravity needed 96: less grip, more slip.) On slopes over ~10 deg spot
    # turns scrub, slide downhill and turn slower, as skid-steer does.
    rover_width:                        89.0
    # Headlights at start. Sent to Unreal whenever it (re)connects, so every
    # Play session starts with this state; the dashboard toggles them.
    headlights_on:                      false
    # Headlight brightness at start, 0..1 of the Blueprint's own intensity
    # (HeadLight_L / HeadLight_R, 20000 cd each). Sent with headlights_on in
    # every packet; the headlights_intensity topic (std_msgs/Float32) and the
    # dashboard's slider change it.
    headlights_intensity:               1.0


    # Acceleration limits: a commanded velocity step (manual `ros2 topic pub`,
    # the planner, teleop) is ramped to these rates instead of jumping (per
    # simulated second). Earth gravity (Unreal DefaultGravityZ -980). Under Moon
    # gravity (-162) the wheels' reaction lifted the light body: 0.6 m/s^2 to
    # 0.3 m/s flipped it and 0.1 was needed; Earth gravity holds it down.
    max_linear_accel:                    0.4  # m/s^2
    max_angular_accel:                   1.0  # rad/s^2

    # Deceleration limits. The ramp completes even if cmd_vel stops arriving.
    max_linear_decel:                    0.4  # m/s^2
    max_angular_decel:                   1.5  # rad/s^2