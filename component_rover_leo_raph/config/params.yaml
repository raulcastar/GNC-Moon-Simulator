lc_component_rover_leo_raph:
  ros__parameters:
    # Run on the simulation clock (/clock from component_sim_clock): stamps
    # and timers follow Unreal's time, and pause when Play is not running.
    use_sim_time: true

    # udp | tcp
    #
    # tcp carries commands and telemetry on one bidirectional connection. Replies
    # come back the way they came, so neither side needs the other's address —
    # which removes every failure mode the UDP path has under WSL2 mirrored
    # networking. Frames are newline-delimited JSON.
    #
    # udp keeps the original two-socket scheme (sending_port out, listen_port in).
    transport:                           tcp

    # Who dials. Unreal's TCP component connects out, so this side listens.
    #   server  we listen on tcp_port; Unreal connects to us
    #   client  we connect to a listening Unreal at sending_ip:tcp_port
    tcp_role:                         server
    tcp_port:                            3003

    # Where Unreal's UDP plugin listens for drive commands.
    #
    # 127.0.0.1 is correct under WSL2 mirrored networking: datagrams sent there
    # from the container reach the Unreal process on the Windows host. Verified
    # by counters — Windows logs the datagrams as received on a listening port.
    # Do not use the host's LAN address: mirrored networking makes it ambiguous
    # between Windows and WSL, and packets are lost.
    #
    # 0.0.0.0 means autodetect (take Unreal's address from the source of its
    # telemetry). It only works once Unreal actually sends telemetry, so it is
    # not the default.
    sending_ip:                    127.0.0.1
    sending_port:                       3002

    # Wildcard here is correct: accept telemetry on every interface.
    listen_ip:                       0.0.0.0
    listen_port:                        3001
    # m/s -> Unreal wheel input units. Measured under Moon gravity with physics
    # substepping and low body damping: 0.2 m/s commanded -> 0.196 m/s driven.
    wheel_speed_scale:                  1.82
    # Centimeters, effective skid-steer track (physical: 38; skid-steer slip makes
    # the effective one wider). Calibrated on level ground (< 4 deg): with 80,
    # 0.2 rad/s commanded -> 0.166 rad/s turned, so 80 / 0.83. On slopes over
    # ~10 deg spot turns scrub, slide downhill and turn slower, as skid-steer does.
    rover_width:                        96.0
    # Headlights at start. Sent to Unreal whenever it (re)connects, so every
    # Play session starts with this state; the dashboard toggles them.
    headlights_on:                      false

    # Body roll sign.
    tilt_roll_sign:                     -1.0

    # Acceleration limits: a commanded velocity STEP (manual `ros2 topic pub`,
    # the planner, teleop) is ramped to these rates instead of jumping. Under
    # Moon gravity the wheels' reaction lifts the light body easily: at 0.6
    # m/s^2 a step to 0.3 m/s flipped the rover, at 0.1 it stays within ~1 deg
    # of pitch. These caps sit below the planner's own ~0.4 m/s^2 ramp, so they
    # set the rover's acceleration.
    max_linear_accel:                    0.1  # m/s^2
    max_angular_accel:                   0.3  # rad/s^2

    # Deceleration limits. The ramp completes even if cmd_vel stops arriving.
    max_linear_decel:                    0.1  # m/s^2
    max_angular_decel:                   0.5  # rad/s^2