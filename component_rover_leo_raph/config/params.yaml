lc_component_rover_leo_raph:
  ros__parameters:
    # udp | tcp
    #
    # tcp carries commands and telemetry on one bidirectional connection. Replies
    # come back the way they came, so neither side needs the other's address —
    # which removes every failure mode the UDP path has under WSL2 mirrored
    # networking. Frames are newline-delimited JSON.
    #
    # udp keeps the original two-socket scheme (sending_port out, listen_port in).
    transport:                           tcp

    # Who dials. Unreal's TCP component connects out, so this side listens.
    #   server  we listen on tcp_port; Unreal connects to us
    #   client  we connect to a listening Unreal at sending_ip:tcp_port
    tcp_role:                         server
    tcp_port:                            3003

    # Where Unreal's UDP plugin listens for drive commands.
    #
    # 127.0.0.1 is correct under WSL2 mirrored networking: datagrams sent there
    # from the container reach the Unreal process on the Windows host. Verified
    # by counters — Windows logs the datagrams as received on a listening port.
    # Do not use the host's LAN address: mirrored networking makes it ambiguous
    # between Windows and WSL, and packets are lost.
    #
    # 0.0.0.0 means autodetect (take Unreal's address from the source of its
    # telemetry). It only works once Unreal actually sends telemetry, so it is
    # not the default.
    sending_ip:                    127.0.0.1
    sending_port:                       3002

    # Wildcard here is correct: accept telemetry on every interface.
    listen_ip:                       0.0.0.0
    listen_port:                        3001
    rover_width:                        35.0 # centimeters, distance between left and right wheels
    headlights_on:                      true

    # Acceleration limits: a commanded velocity STEP (manual `ros2 topic pub`,
    # or any glitch) is ramped to these rates instead of jumping, so the rover
    # does not tip on a hard launch. The path planner already ramps at ~0.4
    # m/s^2, so these caps sit just above it and leave normal driving untouched
    # — lower them if the rover still tips, raise them for snappier response.
    max_linear_accel:                    0.6  # m/s^2
    max_angular_accel:                   1.5  # rad/s^2