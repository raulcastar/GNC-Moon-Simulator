# docker-compose.yml
services:
  zenoh_router:
    build:
      context: ./docker
      dockerfile: base.Dockerfile
    image: gnc_moon_simulator/zenoh_router:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash && ros2 run rmw_zenoh_cpp rmw_zenohd"

  component_lidar:
    build:
      context: ./component_lidar
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_lidar:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_lidar:/opt/ros/jazzy/src/component_lidar
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  # Owns the single UnrealCV client connection and serves all three navcams:
  # navcam_left/* and navcam_right/* (colour), navcam_central/* (colour, planar
  # depth, disparity, object mask). Replaced component_cameras, which was
  # deleted — UnrealCV allows one client at a time, so nothing else may connect.
  component_stereo_depth:
    build:
      context: ./component_stereo_depth
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_stereo_depth:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_stereo_depth:/opt/ros/jazzy/src/component_stereo_depth
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  component_rover_leo_raph:
    build:
      context: ./component_rover_leo_raph
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_rover_leo_raph:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"  
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_rover_leo_raph:/opt/ros/jazzy/src/component_rover_leo_raph
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  component_path_planner:
    build:
      context: ./component_path_planner
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_path_planner:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_path_planner:/opt/ros/jazzy/src/component_path_planner
      - ./custom_map_interfaces:/opt/ros/jazzy/src/custom_map_interfaces
      - /tmp/.X11-unix:/tmp/.X11-unix:rw


  # Builds the local DEM from stereo depth — starts automatically; the mission
  # control dashboard renders its elevation_grid live.
  component_local_mapping:
    build:
      context: ./component_local_mapping
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_local_mapping:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
    volumes:
      - ./component_local_mapping:/opt/ros/jazzy/src/component_local_mapping
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  # Simulated IMU: differentiates /odom (Unreal pose telemetry) into sensor_msgs/Imu.
  component_imu:
    build:
      context: ./component_imu
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_imu:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
    volumes:
      - ./component_imu:/opt/ros/jazzy/src/component_imu

  # Simulated event (DVS) camera: receives the UnrealEventCam plugin's TCP event
  # stream (port 3005) and publishes an event-frame visualisation.
  component_event_camera:
    build:
      context: ./component_event_camera
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_event_camera:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
    volumes:
      - ./component_event_camera:/opt/ros/jazzy/src/component_event_camera

  # Web mission control on http://localhost:5000 — starts automatically.
  mission_control_dashboard:
    build:
      context: ./mission_control_dashboard
      dockerfile: Dockerfile
    image: gnc_moon_simulator/mission_control_dashboard:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./mission_control_dashboard:/opt/ros/jazzy/src/mission_control_dashboard
      - ./custom_map_interfaces:/opt/ros/jazzy/src/custom_map_interfaces
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
  debug_cli:
    build:
      context: ./docker
      dockerfile: base.Dockerfile
    image: gnc_moon_simulator/debug_cli:dev
    network_mode: host
    ipc: host
    entrypoint: ["/bin/bash", "-c", "source /opt/ros/jazzy/setup.bash && exec /bin/bash"]    
    privileged: true
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
