# docker-compose.yml
services:
  component_cameras:
    build:
      context: ./component_cameras
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_cameras:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_cameras:/opt/ros/jazzy/src/component_cameras
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    
  component_rover_leo_raph:
    build:
      context: ./component_rover_leo_raph
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_rover_leo_raph:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"  
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_rover_leo_raph:/opt/ros/jazzy/src/component_rover_leo_raph
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  debug_cli:
    build:
      context: ./docker
      dockerfile: base.Dockerfile
    image: gnc_moon_simulator/debug_cli:dev
    network_mode: host
    ipc: host
    entrypoint: ["/bin/bash", "-c", "source /opt/ros/jazzy/setup.bash && exec /bin/bash"]    
    privileged: true
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
