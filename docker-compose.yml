# docker-compose.yml
#
# Every service runs on the host network and IPC namespace (Zenoh shared memory)
# and restarts with Docker. A component image is its package's extra
# dependencies plus GNC_PACKAGE; the shared /entrypoint.sh (docker/entrypoint.sh,
# baked into the base image) builds the mounted workspace and launches it.
#
# Base image first:  docker build -t gnc_moon_simulator/base:1.0 -f docker/base.Dockerfile docker
# (docker_build.sh does that, then builds and starts everything below).

x-host: &host
  network_mode: host
  ipc: host
  restart: unless-stopped

x-ros-env: &ros-env
  ROS_DOMAIN_ID: 0
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  RCUTILS_COLORIZED_OUTPUT: 1
  # numpy's OpenBLAS starts a worker per core whose idle threads busy-wait after
  # every matrix call; the nodes' matrices (3x3 rotations of point clouds) are
  # far too small to gain from them. Measured on the stereo node: ~40% of a
  # core spent spinning.
  OPENBLAS_NUM_THREADS: 1

# For nodes that can open a debug window on the host's X server (off by default).
x-display-env: &display-env
  DISPLAY: ${DISPLAY}
  QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz

x-ros-node: &ros-node
  <<: *host
  entrypoint: >
    bash -lc "/entrypoint.sh"
  environment:
    <<: *ros-env

services:
  zenoh_router:
    <<: *host
    build:
      context: ./docker
      dockerfile: base.Dockerfile
    image: gnc_moon_simulator/zenoh_router:dev
    environment:
      ROS_DOMAIN_ID: 0
      RCUTILS_COLORIZED_OUTPUT: 1
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash && ros2 run rmw_zenoh_cpp rmw_zenohd"

  component_lidar:
    <<: *ros-node
    build: ./component_lidar
    image: gnc_moon_simulator/component_lidar:dev
    volumes:
      - ./component_lidar:/opt/ros/jazzy/src/component_lidar

  # Simulated stereo navcam rig: receives the UnrealStereoCam plugin's TCP frame
  # stream (port 3004) and serves all three navcams: navcam/left/* and
  # navcam/right/* (colour), navcam/central/* (colour, SGBM depth, disparity,
  # ground-truth depth, object and shadow masks).
  component_stereo_depth:
    <<: *ros-node
    build: ./component_stereo_depth
    image: gnc_moon_simulator/component_stereo_depth:dev
    volumes:
      - ./component_stereo_depth:/opt/ros/jazzy/src/component_stereo_depth

  component_rover_leo_raph:
    <<: *ros-node
    environment:
      <<: *ros-env
      GNC_ROVER: ${GNC_ROVER:-leo_raph}   # which rover (.env)
    build: ./component_rover_leo_raph
    image: gnc_moon_simulator/component_rover_leo_raph:dev
    volumes:
      - ./component_rover_leo_raph:/opt/ros/jazzy/src/component_rover_leo_raph

  # Global planner and local trajectory controller. enable_path_visualization
  # (config/params.yaml) opens a matplotlib window on the host display.
  component_path_planner:
    <<: *ros-node
    build: ./component_path_planner
    image: gnc_moon_simulator/component_path_planner:dev
    environment:
      <<: [*ros-env, *display-env]
      GNC_ROVER: ${GNC_ROVER:-leo_raph}   # which rover (.env)
    volumes:
      - ./component_path_planner:/opt/ros/jazzy/src/component_path_planner
      - ./custom_map_interfaces:/opt/ros/jazzy/src/custom_map_interfaces
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  # Builds the local DEM from stereo depth; the mission control dashboard renders
  # its elevation_grid live. debug_mode (config/params.yaml) opens a matplotlib
  # window on the host display.
  component_local_mapping:
    <<: *ros-node
    build: ./component_local_mapping
    image: gnc_moon_simulator/component_local_mapping:dev
    environment:
      <<: [*ros-env, *display-env]
    volumes:
      - ./component_local_mapping:/opt/ros/jazzy/src/component_local_mapping
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  # Simulated IMU: differentiates /odom (Unreal pose telemetry) into sensor_msgs/Imu.
  component_imu:
    <<: *ros-node
    build: ./component_imu
    image: gnc_moon_simulator/component_imu:dev
    volumes:
      - ./component_imu:/opt/ros/jazzy/src/component_imu

  # The rover's frames: urdf/<GNC_ROVER>.urdf (exported from the Unreal Blueprint
  # by component_robot_description/unreal/export_rover_urdf.py) published as
  # static TF by robot_state_publisher. odom -> base_link comes from the rover node.
  component_robot_description:
    <<: *ros-node
    environment:
      <<: *ros-env
      GNC_ROVER: ${GNC_ROVER:-leo_raph}   # which rover (.env)
    build: ./component_robot_description
    image: gnc_moon_simulator/component_robot_description:dev
    volumes:
      - ./component_robot_description:/opt/ros/jazzy/src/component_robot_description

  # Simulation clock: receives the UnrealSimClock plugin's TCP time stream
  # (port 3008) and publishes /clock; the GNC nodes run on it (use_sim_time).
  component_sim_clock:
    <<: *ros-node
    build: ./component_sim_clock
    image: gnc_moon_simulator/component_sim_clock:dev
    volumes:
      - ./component_sim_clock:/opt/ros/jazzy/src/component_sim_clock

  # Simulated event (DVS) camera: receives the UnrealEventCam plugin's TCP event
  # stream (port 3005) and publishes an event-frame visualisation.
  component_event_camera:
    <<: *ros-node
    build: ./component_event_camera
    image: gnc_moon_simulator/component_event_camera:dev
    volumes:
      - ./component_event_camera:/opt/ros/jazzy/src/component_event_camera

  # Simulated single-photon (SPAD) camera: receives the UnrealSPADCam plugin's
  # intensity stream (port 3006), runs the spadSim photon model, and publishes
  # single-photon binary frames plus a digitised reconstruction.
  component_spad_camera:
    <<: *ros-node
    build: ./component_spad_camera
    image: gnc_moon_simulator/component_spad_camera:dev
    volumes:
      - ./component_spad_camera:/opt/ros/jazzy/src/component_spad_camera

  # Web mission control on http://localhost:5000 — starts automatically.
  mission_control_dashboard:
    <<: *ros-node
    environment:
      <<: *ros-env
      GNC_ROVER: ${GNC_ROVER:-leo_raph}   # which rover (.env)
    build: ./mission_control_dashboard
    image: gnc_moon_simulator/mission_control_dashboard:dev
    volumes:
      - ./mission_control_dashboard:/opt/ros/jazzy/src/mission_control_dashboard
      - ./custom_map_interfaces:/opt/ros/jazzy/src/custom_map_interfaces
      # The rover-dependent configs, read by the overview's ROVER selector (src/rovers.py)
      - ./component_rover_leo_raph/config:/opt/gnc/rovers/component_rover_leo_raph:ro
      - ./component_path_planner/config:/opt/gnc/rovers/component_path_planner:ro
      - ./component_robot_description/urdf:/opt/gnc/rovers/urdf:ro

  # Interactive shell with the ROS 2 tools (rviz2, rqt) on the host display:
  #   docker compose exec debug_cli bash
  debug_cli:
    build:
      context: ./docker
      dockerfile: tools.Dockerfile           # base + rviz2 / rqt
    image: gnc_moon_simulator/debug_cli:dev
    network_mode: host
    ipc: host
    entrypoint: ["/bin/bash", "-c", "source /opt/ros/jazzy/setup.bash && exec /bin/bash"]
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
    environment:
      <<: [*ros-env, *display-env]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
