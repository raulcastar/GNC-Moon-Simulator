# docker-compose.yml
services:
  zenoh_router:
    build:
      context: ./docker
      dockerfile: base.Dockerfile
    image: gnc_moon_simulator/zenoh_router:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash && ros2 run rmw_zenoh_cpp rmw_zenohd"

  component_cameras:
    build:
      context: ./component_cameras
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_cameras:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_cameras:/opt/ros/jazzy/src/component_cameras
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    
  component_rover_leo_raph:
    build:
      context: ./component_rover_leo_raph
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_rover_leo_raph:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"  
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_rover_leo_raph:/opt/ros/jazzy/src/component_rover_leo_raph
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

  component_path_planner:
    build:
      context: ./component_path_planner
      dockerfile: Dockerfile
    image: gnc_moon_simulator/component_path_planner:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: >
      bash -lc "/entrypoint.sh"
    privileged: true
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./component_path_planner:/opt/ros/jazzy/src/component_path_planner
      - ./custom_map_interfaces:/opt/ros/jazzy/src/custom_map_interfaces
      - /tmp/.X11-unix:/tmp/.X11-unix:rw


  mission_control_dashboard:
    build:
      context: ./mission_control_dashboard
      dockerfile: Dockerfile
    image: gnc_moon_simulator/mission_control_dashboard:dev
    network_mode: host
    ipc: host
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c", "source /opt/ros/jazzy/setup.bash && exec /bin/bash"]    
    privileged: true
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - ./mission_control_dashboard:/opt/ros/jazzy/src/mission_control_dashboard
      - ./custom_map_interfaces:/opt/ros/jazzy/src/custom_map_interfaces
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
  debug_cli:
    build:
      context: ./docker
      dockerfile: base.Dockerfile
    image: gnc_moon_simulator/debug_cli:dev
    network_mode: host
    ipc: host
    entrypoint: ["/bin/bash", "-c", "source /opt/ros/jazzy/setup.bash && exec /bin/bash"]    
    privileged: true
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
    environment:
      ROS_DOMAIN_ID: 0
      ROBOT_NAMESPACE: ""
      LAUNCH_ARGS: ""
      RCUTILS_COLORIZED_OUTPUT: 1
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1 # Prevents shared memory errors with Qt/Rviz
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
