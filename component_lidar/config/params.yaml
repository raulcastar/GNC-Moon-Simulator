lc_component_lidar:
  ros__parameters:
    # Run on the simulation clock (/clock from component_sim_clock): stamps
    # and timers follow Unreal's time, and pause when Play is not running.
    use_sim_time: true

    # The UnrealLidarCam plugin: a lidar with a configurable horizontal and
    # vertical aperture, streamed over TCP.
    # Each scan is published as an organized PointCloud2 (rows = channels) on
    # `topic`, in the sensor frame `frame_id` (x forward, y left, z up).
    bind_ip: "0.0.0.0"
    port: 3007                  # The component's Server Port in Unreal
    topic: "lidar/points"
    frame_id: "lidar"
