lc_component_local_mapping:
  ros__parameters:
    # Camera namespace served by component_stereo_depth. Subscribes to
    # <camera_topic>/image_depth, /image_color and /camera_info.
    #
    # image_depth is the stereo result reprojected into the central camera, not
    # Unreal's depth buffer: sparse, with occlusion holes, accuracy degrading as
    # Z²/(fx·B). navcam/central/depth_gt carries the exact buffer.
    camera_topic: navcam/central

    # ── Pinhole camera intrinsics (pixels) ────────────────────────────────────
    # Prefer camera_info: the publisher derives fx from the FOV it reads out of
    # Unreal, so an editor change cannot silently stretch the DEM in range.
    use_camera_info: true

    # Fallback until the first camera_info: fx = fy = (width/2) / tan(HFOV/2)
    #   640-px image, 90° HFOV  →  fx = fy = 320.0
    #   640-px image, 60° HFOV  →  fx = fy = 554.3
    camera_fx: 320.0
    camera_fy: 320.0
    camera_cx: 320.0   # Cu in reference — image centre x  (= width  / 2)
    camera_cy: 240.0   # Cv in reference — image centre y  (= height / 2)

    # ── Physical camera mounting ───────────────────────────────────────────────
    # camera_height_m: distance from the ground plane to the camera optical
    #   centre (= physical_height in CameraTransform). Used by rotateRefSystem
    #   to set the absolute elevation of z_w = 0 at the ground.
    camera_height_m: 0.40   # metres (reference example: 0.40 m)

    # camera_angle: tilt of the camera from horizontal in degrees.
    #   0   = camera looking straight ahead (horizontal)
    #   Sign (verified against the transform total = pi/2 + camera_angle, and
    #   empirically against the live DEM): DOWN tilt is POSITIVE. camera_angle
    #   = +90 gives z_w = h - d (nadir, correct); -90 gives z_w = h + d (up).
    #   The navcams are physically pitched DOWN 20 deg in Unreal, so this is +20.
    camera_angle: 20.0

    # camera_roll: lateral (sideways) tilt of the camera mounting in degrees.
    #   0   = camera level (no lateral tilt)
    #   +ve = camera tilted right (right side up)
    #   -ve = camera tilted left
    # This is the fixed mechanical mounting offset; live rover roll comes from /odom.
    camera_roll: 0.0

    # ── DEM computation parameters ────────────────────────────────────────────
    # map_resolution: size of one DEM cell in metres (= 1/resolution_multiplier
    #   in reference code).  0.01 = 1 cm/cell, 0.05 = 5 cm/cell.
    map_resolution: 0.05   # metres per cell

    # distance_limit: maximum x_w (lateral) and y_w (forward) distance in metres.
    #   Points beyond this are discarded before building the grid — matches the
    #   distance_limit argument of MergedImage.computeDEM.
    distance_limit: 3.0   # metres — set to cover the full observed depth range

    # ── Depth pixel validity window (metres) ──────────────────────────────────
    # min_valid_depth: reject pixels closer than this (noise / self-occlusion).
    # The upper bound is distance_limit — one parameter controls both the raw
    # pixel filter and the world-frame distance gate.
    min_valid_depth: 0.1

    # The depth topic carries planar Z depth in metres; component_stereo_depth
    # converts UnrealCV's radial buffer exactly once, so do not convert again.
    #
    # depth_scale: multiply the incoming depth by this to obtain true metres.
    # Check the log line "[DEM diag] depth range" — if objects 1 m away show as
    # ~10 m, the publisher's unit assumption is wrong; fix it there.
    depth_scale: 1.0

    # ── Elevation sanity window (metres, rover base = 0) ──────────────────────
    # Stereo depth on textureless regolith, seen at the grazing angle of a
    # near-horizontal camera, throws occasional wild outliers — measured heights
    # from -2.5 m to +3.2 m over a 3 m patch. The DEM keeps the MAX height per
    # cell (so rocks survive), which means one bad point spikes a whole cell.
    # This window discards physically impossible elevations before binning.
    # Widen if you drive real crater walls / tall boulders; tighten to reject
    # more noise. -2.5..+3.2 m was outliers; ground+rocks live in roughly ±1 m.
    min_elevation: -1.0    # metres below the rover base
    max_elevation:  1.5    # metres above the rover base

    # Apply live rover roll/pitch from /odom to the DEM. Keep FALSE: the odom
    # orientation is in a non-standard frame (the same one that mirrors the
    # dashboard heading), so the extracted roll is spurious (~-84° on flat
    # ground) and rotates the DEM into a narrow warped sliver. The fixed camera
    # mounting tilt is already handled by camera_angle. Only set true once the
    # odom orientation is republished in a standard REP-103 frame.
    apply_rover_tilt: false

    # ── Debug DEM visualisation ───────────────────────────────────────────────
    # Off: the container runs headless and the mission control dashboard now
    # renders local_mapping/elevation_grid live, replacing the matplotlib view.
    debug_mode: false
    debug_save_path: /opt/ros/jazzy/src/component_local_mapping/debug_dem.png
