lc_component_local_mapping:
  ros__parameters:
    # Run on the simulation clock (/clock from component_sim_clock): stamps
    # and timers follow Unreal's time, and pause when Play is not running.
    use_sim_time: true

    # Camera namespace served by component_stereo_depth. Subscribes to
    # <camera_topic>/image_depth, /image_color and /camera_info.
    #
    # image_depth is the stereo result reprojected into the central camera, not
    # Unreal's depth buffer: sparse, with occlusion holes, accuracy degrading as
    # Z²/(fx·B). navcam/central/depth_ground_truth carries the exact buffer.
    camera_topic: navcam/central

    # ── Pinhole camera intrinsics (pixels) ────────────────────────────────────
    # Prefer camera_info: the publisher derives fx from the FOV it reads out of
    # Unreal, so an editor change cannot silently stretch the DEM in range.
    use_camera_info: true

    # Fallback until the first camera_info: fx = fy = (width/2) / tan(HFOV/2)
    #   640-px image, 90° HFOV  →  fx = fy = 320.0
    #   640-px image, 60° HFOV  →  fx = fy = 554.3
    camera_fx: 320.0
    camera_fy: 320.0
    camera_cx: 320.0   # image centre x (= width  / 2)
    camera_cy: 240.0   # image centre y (= height / 2)

    # ── Physical camera mounting ───────────────────────────────────────────────
    # Read from TF at configure (base_link -> navcam_central_link, base_footprint;
    # component_robot_description: the URDF exported from the Unreal Blueprint)
    # when mount_from_tf; the camera_* values below are the fallback without TF.
    mount_from_tf: true
    # camera_height_m: distance from the ground plane to the camera optical
    #   centre, so that z_w = 0 is the ground.
    # From the URDF: navcam_central_link is 0.465 m above base_link, which is at
    # axle height (0.0885 m above the ground under base_footprint).
    camera_height_m: 0.553  # metres

    # camera_offset_*: Navcam_Center optical centre relative to base_link (the
    #   odometry point), rover body frame (forward, left, up), metres. Places
    #   the point cloud and elevation grid in the odom frame.
    camera_offset_forward_m: 0.185
    camera_offset_lateral_m: 0.0
    camera_offset_up_m:      0.465

    # camera_angle: tilt of the camera from horizontal in degrees, positive
    #   down (0 = horizontal, +90 = straight down). The navcams are pitched
    #   20 deg down in Unreal.
    camera_angle: 20.0

    # camera_roll: lateral (sideways) tilt of the camera mounting in degrees.
    #   0   = camera level (no lateral tilt)
    #   +ve = camera tilted right (right side up)
    #   -ve = camera tilted left
    # This is the fixed mechanical mounting offset; live rover roll comes from /odom.
    camera_roll: 0.0

    # ── DEM computation parameters ────────────────────────────────────────────
    # map_resolution: size of one DEM cell in metres (0.05 = 5 cm/cell).
    map_resolution: 0.05   # metres per cell

    # distance_limit: maximum lateral and forward distance in metres; points
    #   beyond it are discarded before building the grid.
    distance_limit: 3.0   # metres

    # ── Depth pixel validity window (metres) ──────────────────────────────────
    # min_valid_depth: reject pixels closer than this (noise / self-occlusion).
    # The upper bound is distance_limit — one parameter controls both the raw
    # pixel filter and the world-frame distance gate.
    min_valid_depth: 0.1

    # depth_scale: factor from the incoming depth to metres. The stereo node
    # already publishes metres; debug_mode logs the depth range to check it.
    depth_scale: 1.0

    # ── Elevation sanity window (metres, rover base = 0) ──────────────────────
    # Stereo depth on textureless regolith at grazing angles throws occasional
    # outliers (measured from -2.5 m to +3.2 m over a 3 m patch, while ground
    # and rocks lie within about ±1 m). Elevations outside this window are
    # discarded before binning; widen it for crater walls or tall boulders.
    min_elevation: -1.0    # metres below the rover base
    max_elevation:  1.5    # metres above the rover base

    # ── Outlier rejection per DEM cell ────────────────────────────────────────
    # Each cell takes its (drop_highest + 1)-th highest point, so isolated stereo
    # outliers do not spike it; cells with fewer than min_points_per_cell points
    # stay unobserved.
    min_points_per_cell: 2
    drop_highest:        1

    # Apply live rover roll/pitch from /odom (at each frame's capture time) to
    # the DEM: the rover node publishes base_link's true attitude (REP-103), so
    # this compensates rough terrain.
    apply_rover_tilt: true

    # ── Debug DEM visualisation ───────────────────────────────────────────────
    # A matplotlib window on the host display; the dashboard shows the DEM live.
    debug_mode: false
    debug_save_path: /opt/ros/jazzy/src/component_local_mapping/debug_dem.png
