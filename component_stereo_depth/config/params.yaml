lc_component_stereo_depth:
  ros__parameters:
    # Run on the simulation clock (/clock from component_sim_clock): stamps
    # and timers follow Unreal's time, and pause when Play is not running.
    use_sim_time: true

    # Per-frame log of matching coverage, for diagnosis (the read cycle's rate and
    # timing are logged every 30 s regardless).
    debug_mode:                           false
    # How often the node checks for a new stereo pair. Each new pair is processed
    # once (~110 ms); a check that finds nothing new returns at once. Polling
    # faster than the UnrealStereoCam SendHz (5 in the level) is what lets every
    # pair be taken: at an equal rate the two beat and about a third are missed.
    image_reading_hz_rate:                10.0

    # ── Frame stream ──────────────────────────────────────────────────────────
    # Frames are pushed by the UnrealStereoCam plugin (the Unreal project's Plugins/UnrealStereoCam/)
    # to this TCP server: captures render with the game frame and reach this node
    # with no game-thread stall. Left/right are paired by Unreal's frame counter,
    # so both eyes always come from the same world tick.
    stream_bind_ip:                    0.0.0.0
    stream_port:                          3004

    # ── The three navcams ─────────────────────────────────────────────────────
    # left/right form the stereo pair. The stereo depth is reprojected onto the
    # central camera's pixel grid, so its depth, disparity, object mask and RGB
    # all overlay one another.
    #
    # These are the UnrealStereoCam cam ids (its Left/Right/Center CamId).
    # On startup this node logs where the central
    # camera sits along the baseline: expect ~50%, ~0 cm off the eye-to-eye line.
    left_camera_id:                          1
    right_camera_id:                         2
    center_camera_id:                        0   # Navcam_Sensor

    # Object-segmentation capture. Must equal the UnrealStereoCam
    # MaskCamId. Its SceneCapture uses a post-process material that colours the
    # Custom Depth-Stencil buffer, each object a flat colour. Set < 0 to stream
    # no mask (and set enable_object_mask: false).
    mask_camera_id:                          3

    # Extra mono cameras streamed as they are, no stereo:
    #   "<cam_id>:<topic>[:<hfov_deg>[:<mask_cam_id>]]"
    # Each needs a SceneCapture2D in Unreal streamed on that cam id — e.g. the
    # rover's RearCam, streamed by its own UnrealStereoCam component
    # (RearCam_Stream: Center = RearCam, CenterCamId = 10). Published on
    # <topic>/image_color (+ /compressed, + /camera_info when hfov_deg is set).
    # With mask_cam_id, its object-mask capture (RearCam_Mask, the streamer's
    # Mask on MaskCamId 13; a copy of Navcam_Mask's render settings) is published
    # like the central one: <topic>/object_mask (+ _mapping, _classes) and, with
    # enable_shadow_mask, <topic>/shadow_mask, shadow_label (+ _mapping). The
    # enable_object_mask / enable_shadow_mask switches below cover it too; drop
    # the mask id (or clear MaskCaptureName in Unreal) to stop it.
    extra_cameras:
      - "10:rear_cam:90:13"
    extra_cameras_hz:                      5.0

    # Object-mask classes: id, name, colour and group of each class, published
    # as JSON on object_mask_mapping (id -> name) and object_mask_classes (the
    # full list; the dashboard draws its legend from it). The file is the same
    # as Terrain Studio's config/mask_classes.json, which bakes the ids and
    # colours into the Unreal mask material: edit both together. Empty: this
    # package's config/mask_classes.json.
    mask_classes_file:                     ""

    # Hierarchical topic namespaces. TF frame names are derived by flattening
    # them ('navcam/central' -> 'navcam_central'), since tf2 forbids '/'.
    left_topic:                    navcam/left
    right_topic:                  navcam/right
    center_topic:               navcam/central

    # ── Rig geometry ──────────────────────────────────────────────────────────
    # A stream cannot be measured, so BOTH ARE REQUIRED: set them to the
    # UnrealStereoCam captures' real geometry.
    #   baseline_m  metres between the eyes
    #   hfov_deg    the captures' FOVAngle
    baseline_m:                            0.2   # metres between the eyes
    hfov_deg:                             90.0   # capture FOVAngle, degrees

    # Centre camera's distance from the LEFT eye along the baseline, metres.
    # Negative = midpoint of the eyes.
    center_offset_m:                      -1.0

    # ── Matching window ───────────────────────────────────────────────────────
    # num_disparities is the width of the SGBM search window, hence also of the
    # unmatched left border. Positive multiple of 16, capped at 256. Everything
    # else follows from it:
    #
    #   nearest resolvable surface   near = fx*B / num_disparities
    #   left border cost             num_disparities columns (see fill_left_border)
    #   matching time                linear in it
    #
    # Depth nearer than the derived near limit is rejected; the node logs it.
    # Surfaces closer still alias into the search range as plausible garbage.
    #
    # With fx*B = 64 (20 cm baseline, 90°, 640 px):
    #   64  -> near 1.00 m, border 10% of the image
    #   128 -> near 0.50 m, border 20%
    #   224 -> near 0.29 m, border 35%
    #
    # The navcams are horizontal at 0.4 m, so the bottom of the image sees ground
    # at only ~0.53 m. At 64 (near 1.0 m) that whole near band is inside the blind
    # zone and never matches — the "lower image doesn't work" symptom, and the
    # source of the DEM's holes near the rover. 128 (near 0.5 m) resolves it; the
    # extra border is recovered by fill_left_border. Raise to 160/192 if the very
    # bottom rows still drop out (e.g. when the rover pitches forward).
    num_disparities:                       128

    max_depth_m:                           6.0

    block_size:                              5   # forced odd; 3-11 is sensible
    uniqueness_ratio:                       10
    speckle_window_size:                   100
    speckle_range:                          32

    # Recover the left border. OpenCV blanks every column u < numDisparities,
    # where the widest search window does not fit. The true constraint is
    # per-pixel: a left pixel at column u with disparity d matches right pixel
    # u - d, so it is recoverable whenever d <= u.
    #
    # Both images are padded by numDisparities before matching and cropped back,
    # then `u - d >= 0` is enforced exactly. A surface at max_depth_m becomes
    # matchable from column fx*B/max_depth_m onward. Costs ~numDisparities/width
    # extra matching time.
    #
    # What stays blank is what the right camera cannot see: near surfaces at the
    # far left.
    fill_left_border:                     true

    # CLAHE on both images before matching. Recovers texture from near-clipped
    # pixels, but not from a fully saturated highlight. Leave false to measure
    # the raw glare penalty; true to see what a real pipeline could claw back.
    equalize_for_glare:                  false

    # ── Central camera products ───────────────────────────────────────────────
    # Clamp and colormap range for image_depth / image_depth/visualization.
    depth_max_distance:                    6.0   # metres

    # Publishes navcam/central/depth_ground_truth (32FC1): Unreal's exact depth
    # for the central camera's view, planar Z in metres like image_depth, +Inf
    # for the sky; and depth_ground_truth/visualization (same colours as
    # image_depth/visualization). Streamed by the UnrealStereoCam plugin
    # (bStreamCenterDepth, DepthCamId) on this cam id; < 0 turns it off.
    depth_ground_truth_camera_id:            4

    # Publishes navcam/central/object_mask (rgb8), object_mask_mapping and
    # object_mask_classes (mask_classes_file as JSON). The mask comes from the UnrealStereoCam
    # segmentation capture named by mask_camera_id; colours are baked into the
    # Unreal post-process material. Needs that capture to exist, or it
    # self-disables.
    enable_object_mask:                   true

    # Publishes navcam/central/shadow_mask (rgb8): anything without sunlight black
    # (ground, rocks, rover), sunlit ground blue, sunlit rocks and rover grey, sky
    # black. Also publishes navcam/central/shadow_label (mono8 class ids, for
    # training) and shadow_label_mapping (JSON legend):
    #   0 sky, 1 sunlit_ground, 2 shadowed_ground, 3 sunlit_object, 4 shadowed_object,
    #   5 rover_shadow (orange in shadow_mask; needs "Tag the rover's shadow" in
    #   Terrain Studio, which flags it in the lowest bit of red)
    # Split from the mask frame: Terrain Studio's mask material flags ground and
    # shadow in the lowest bits of green and blue, which are cleared from
    # object_mask. Needs enable_object_mask.
    enable_shadow_mask:                   true
